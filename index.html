<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cat Art Calendar 2027 · QueeQ 황재하</title>
<meta name="description" content="책상 한쪽에 고양이 한 마리. QueeQ 황재하의 2027 Cat Art Calendar, 캘린더 10,000원.">
<meta name="theme-color" content="#e7c44c">
<meta property="og:title" content="Cat Art Calendar 2027">
<meta property="og:description" content="책상 한쪽에 고양이 한 마리, 어떠세요. 캘린더 10,000원">
<meta property="og:image" content="https://bbbig10000-source.github.io/cat/poster.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #3f3323; --ink-soft: #58482e; --line: #cfac34; }
  * { box-sizing: border-box; }
  html { background: #e7c44c; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    color: var(--ink);
    font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    background: radial-gradient(ellipse 120% 90% at 50% 50%, #eecc50 0%, #e9c64d 55%, #e4c149 100%);
    -webkit-font-smoothing: antialiased;
  }
  main {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: max(22px, env(safe-area-inset-top)) 16px max(26px, env(safe-area-inset-bottom));
  }
  h1 {
    margin: 0;
    font-size: clamp(20px, 5.6vw, 28px);
    font-weight: 700;
    letter-spacing: -0.01em;
    text-align: center;
  }
  .frame {
    position: relative;
    width: min(100%, 430px, calc((100svh - 232px) * 9 / 16));
    min-width: 240px;
    aspect-ratio: 9 / 16;
    border-radius: 22px;
    overflow: hidden;
    background: #1d1a15 url(poster.jpg) center / cover;
    box-shadow: 0 14px 34px rgba(63, 51, 35, 0.28), 0 2px 6px rgba(63, 51, 35, 0.18);
  }
  video { display: block; width: 100%; height: 100%; object-fit: cover; }
  .sound {
    position: absolute;
    right: 12px;
    bottom: 12px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 9px 14px 9px 11px;
    border: 0;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.92);
    color: var(--ink);
    font: 700 14px/1 'Noto Sans KR', system-ui, sans-serif;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    cursor: pointer;
    transition: opacity .25s;
  }
  .sound svg { width: 18px; height: 18px; }
  .sound.on { opacity: 0.55; }
  .price {
    margin: 4px 0 0;
    font-size: clamp(26px, 7.6vw, 36px);
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .price span { font-weight: 400; color: var(--ink-soft); margin-right: .35em; }
  .rule { width: 56px; height: 2px; background: var(--line); border: 0; margin: 2px 0; }
  .sig { height: 22px; width: auto; opacity: .92; }
</style>
</head>
<body>
<main>
  <h1>Cat Art Calendar 2027</h1>
  <div class="frame">
    <video id="v" src="cat.mp4" poster="poster.jpg" autoplay muted loop playsinline preload="auto"></video>
    <button class="sound" id="s" type="button" aria-label="소리 켜기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path id="w1" d="M15.5 8.5a5 5 0 0 1 0 7"/><path id="w2" d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      <b id="t">소리 켜기</b>
    </button>
  </div>
  <p class="price"><span>캘린더</span>10,000원</p>
  <hr class="rule">
  <img class="sig" src="sig.png" alt="QueeQ 황재하">
</main>
<script>
  const v = document.getElementById('v'), s = document.getElementById('s'), t = document.getElementById('t');
  let first = true;
  function paint() {
    const on = !v.muted;
    s.classList.toggle('on', on);
    t.textContent = on ? '소리 끄기' : '소리 켜기';
    s.setAttribute('aria-label', t.textContent);
  }
  function toggle() {
    v.muted = !v.muted;
    if (!v.muted && first) { first = false; v.currentTime = 0; }
    const p = v.play(); if (p && p.catch) p.catch(() => {});
    paint();
  }
  s.addEventListener('click', e => { e.stopPropagation(); toggle(); });
  v.addEventListener('click', toggle);
  const p = v.play(); if (p && p.catch) p.catch(() => {});
  paint();
</script>
</body>
</html>
